<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expense Tracker</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    
    <!-- NAVBAR -->


    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                Expense Tracker
            </span>

        </div>

    </nav>


   
    <!-- MAIN -->

    <main class="container my-4">

        <h1 class="mb-4">
            My Expenses
        </h1>


        
        <!-- ALERT MESSAGE -->
       

        <div id="message"></div>


       
        <!-- SUMMARY CARDS -->


        <section class="summary-grid mb-4">

            <div class="card summary-card">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Amount
                    </h5>

                    <p
                        id="totalAmount"
                        class="display-6 mb-0"
                    >
                        $0.00
                    </p>

                </div>

            </div>


            <div class="card summary-card">

                <div class="card-body">

                    <h5 class="card-title">
                        Number of Expenses
                    </h5>

                    <p
                        id="expenseCount"
                        class="display-6 mb-0"
                    >
                        0
                    </p>

                </div>

            </div>


            <div class="card summary-card">

                <div class="card-body">

                    <h5 class="card-title">
                        Highest Expense
                    </h5>

                    <p
                        id="highestExpense"
                        class="display-6 mb-0"
                    >
                        $0.00
                    </p>

                </div>

            </div>

        </section>


        
        <!-- ADD EXPENSE FORM -->

        <div class="card mb-4">

            <div class="card-body">

                <h2 class="h4 mb-3">
                    Add Expense
                </h2>


                <form id="expenseForm">

                    <div class="row g-3">

                        <!-- Title -->

                        <div class="col-md-6">

                            <label
                                for="title"
                                class="form-label"
                            >
                                Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="Enter expense title"
                            >

                        </div>


                        <!-- Amount -->

                        <div class="col-md-6">

                            <label
                                for="amount"
                                class="form-label"
                            >
                                Amount
                            </label>

                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                placeholder="Enter amount"
                            >

                        </div>


                        <!-- Category -->

                        <div class="col-md-6">

                            <label
                                for="category"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select"
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Bills">
                                    Bills
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Date -->

                        <div class="col-md-6">

                            <label
                                for="date"
                                class="form-label"
                            >
                                Date
                            </label>

                            <input
                                type="date"
                                id="date"
                                class="form-control"
                            >

                        </div>

                    </div>


                    <div id="formMessage" class="mt-3"></div>


                    <button
                        type="submit"
                        class="btn btn-primary mt-3"
                    >
                        Add Expense
                    </button>

                </form>

            </div>

        </div>


     
        <!-- FILTER -->

        <div class="mb-3">

            <label
                for="categoryFilter"
                class="form-label"
            >
                Filter by Category
            </label>

            <select
                id="categoryFilter"
                class="form-select"
            >

                <option value="All">
                    All
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        
        <!-- LOADING SPINNER -->
       

        <div
            id="loading"
            class="text-center my-4 d-none"
        >

            <div
                class="spinner-border"
                role="status"
            >

                <span class="visually-hidden">
                    Loading...
                </span>

            </div>

        </div>


        
        <!-- EXPENSE TABLE -->
    

        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>Title</th>

                        <th>Amount</th>

                        <th>Category</th>

                        <th>Date</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="expensesTable">

                </tbody>

            </table>

        </div>

    </main>


   
    <!-- EDIT MODAL -->


    <div
        class="modal fade"
        id="editModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Edit Expense
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <form id="editForm">

                        <input
                            type="hidden"
                            id="editId"
                        >


                        <div class="mb-3">

                            <label
                                for="editTitle"
                                class="form-label"
                            >
                                Title
                            </label>

                            <input
                                type="text"
                                id="editTitle"
                                class="form-control"
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="editAmount"
                                class="form-label"
                            >
                                Amount
                            </label>

                            <input
                                type="number"
                                id="editAmount"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="editCategory"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                id="editCategory"
                                class="form-select"
                            >

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Bills">
                                    Bills
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label
                                for="editDate"
                                class="form-label"
                            >
                                Date
                            </label>

                            <input
                                type="date"
                                id="editDate"
                                class="form-control"
                            >

                        </div>


                        <div id="editMessage"></div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Our JavaScript -->
    <script src="app.js"></script>

</body>

</html>
